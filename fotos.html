<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#f8f0e5">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Fotos da Júllia">
  <title>Fotos da Júllia | 15 Anos</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100svh;
      font-family: Arial, sans-serif;
      background: radial-gradient(circle at top, #fffaf2 0%, #f8f0e5 48%, #eee0cc 100%);
      color: #473727;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .card {
      width: 100%;
      max-width: 560px;
      background: rgba(255,255,255,0.92);
      border-radius: 28px;
      padding: 38px 24px;
      text-align: center;
      box-shadow: 0 20px 60px rgba(90,65,35,0.14);
      border: 1px solid rgba(190,145,80,0.32);
    }

    .xv {
      width: 78px;
      height: 78px;
      border: 1px solid #c89b58;
      border-radius: 50%;
      display: grid;
      place-items: center;
      margin: 0 auto 22px;
      font-family: Georgia, serif;
      font-size: 30px;
      color: #ad7e3d;
    }

    .eyebrow {
      font-size: 11px;
      letter-spacing: 4px;
      color: #ad7e3d;
      margin-bottom: 10px;
    }

    h1 {
      font-family: Georgia, serif;
      font-weight: normal;
      font-size: 44px;
      margin: 0;
      color: #4d3928;
    }

    h2 {
      font-family: Georgia, serif;
      font-weight: normal;
      font-size: 29px;
      margin: 6px 0 18px;
      color: #8f6633;
    }

    p {
      line-height: 1.65;
      color: #766554;
      margin: 0 auto 26px;
      max-width: 430px;
    }

    .upload-box {
      border: 1px dashed #caa36d;
      border-radius: 22px;
      padding: 24px 18px;
      margin: 25px 0;
      background: #fffaf4;
    }

    #files { display: none; }

    .select-label {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      min-height: 62px;
      border: 2px solid #c89b58;
      border-radius: 16px;
      padding: 16px 20px;
      background: #fff;
      color: #8f6633;
      font-size: 17px;
      font-weight: 700;
      letter-spacing: 1px;
      cursor: pointer;
      box-shadow: 0 8px 22px rgba(173,126,61,0.10);
      transition: transform .15s ease, box-shadow .15s ease;
      user-select: none;
    }

    .select-label:active {
      transform: scale(.985);
    }

    .camera {
      font-size: 22px;
      line-height: 1;
    }

    #selectedCount {
      min-height: 24px;
      margin: 14px 0 16px;
      color: #8a7461;
      font-size: 14px;
      font-weight: 600;
    }

    .send-button {
      width: 100%;
      min-height: 58px;
      border: 0;
      border-radius: 16px;
      padding: 16px;
      background: linear-gradient(135deg, #d5ad72, #ad7e3d);
      color: white;
      font-weight: bold;
      letter-spacing: 1.5px;
      cursor: pointer;
      font-size: 15px;
      box-shadow: 0 10px 26px rgba(173,126,61,0.24);
    }

    .send-button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      box-shadow: none;
    }

    #status {
      margin-top: 18px;
      font-size: 14px;
      line-height: 1.5;
      min-height: 24px;
    }

    .success { color: #56764b; font-weight: 700; }
    .error { color: #a14444; font-weight: 700; }

    .footer {
      margin-top: 28px;
      font-family: Georgia, serif;
      font-style: italic;
      color: #9a8874;
      font-size: 15px;
    }

    .date {
      margin-top: 8px;
      color: #ad7e3d;
      letter-spacing: 3px;
      font-size: 11px;
    }

    @media (max-width: 480px) {
      body { padding: 12px; align-items: stretch; }
      .card {
        min-height: calc(100svh - 24px);
        display: flex;
        flex-direction: column;
        justify-content: center;
        border-radius: 24px;
        padding: 32px 18px;
      }
      h1 { font-size: 42px; }
      h2 { font-size: 27px; }
      .select-label { font-size: 16px; min-height: 66px; }
      .send-button { min-height: 62px; font-size: 16px; }
    }
  </style>
</head>

<body>

  <main class="card">
    <div class="xv">XV</div>

    <div class="eyebrow">JÚLLIA • 15 ANOS</div>

    <h1>Compartilhe</h1>
    <h2>seus momentos</h2>

    <p>
      Você registrou um momento especial da nossa festa?
      Compartilhe suas fotos e ajude a guardar cada lembrança desta noite.
    </p>

    <div class="upload-box">
      <input
        id="files"
        type="file"
        accept="image/jpeg,image/png,image/webp,image/heic,image/heif"
        multiple
      >

      <label for="files" class="select-label">
        <span class="camera">📷</span>
        <span>SELECIONAR FOTOS</span>
      </label>

      <div id="selectedCount">Nenhuma foto selecionada</div>

      <button id="sendButton" class="send-button" onclick="enviarFotos()">
        ENVIAR FOTOS
      </button>

      <div id="status"></div>
    </div>

    <div class="footer">
      Obrigada por fazer parte desta noite ♡
    </div>

    <div class="date">20 • 03 • 2027</div>
  </main>

  <script>
    const SUPABASE_URL =
      "https://vdyocmcdbvgbuvttyeck.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_bx1T6ZBPYjX5Z6zAll33tw_AbWMsj1u";

    const supabaseClient =
      window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const BUCKET = "fotos-jullia-15";

    const input = document.getElementById("files");
    const selectedCount = document.getElementById("selectedCount");

    input.addEventListener("change", () => {
      const total = input.files.length;

      if (total === 0) {
        selectedCount.textContent = "Nenhuma foto selecionada";
      } else if (total === 1) {
        selectedCount.textContent = "1 foto selecionada";
      } else {
        selectedCount.textContent = `${total} fotos selecionadas`;
      }

      document.getElementById("status").textContent = "";
      document.getElementById("status").className = "";
    });

    async function enviarFotos() {
      const button = document.getElementById("sendButton");
      const status = document.getElementById("status");
      const files = Array.from(input.files);

      if (files.length === 0) {
        status.className = "error";
        status.textContent = "Selecione pelo menos uma foto.";
        return;
      }

      button.disabled = true;
      status.className = "";
      status.textContent = `Preparando o envio de ${files.length} foto(s)...`;

      let enviados = 0;
      let erros = 0;

      for (const file of files) {
        try {
          if (!file.type.startsWith("image/")) {
            erros++;
            continue;
          }

          if (file.size > 25 * 1024 * 1024) {
            erros++;
            continue;
          }

          const extensao =
            file.name.split(".").pop()?.toLowerCase() || "jpg";

          const nome =
            `${Date.now()}-${crypto.randomUUID()}.${extensao}`;

          const { error } = await supabaseClient.storage
            .from(BUCKET)
            .upload(nome, file, {
              cacheControl: "3600",
              upsert: false
            });

          if (error) {
            console.error(error);
            erros++;
          } else {
            enviados++;
          }

          status.textContent =
            `Enviando... ${enviados + erros} de ${files.length}`;

        } catch (e) {
          console.error(e);
          erros++;
        }
      }

      button.disabled = false;

      if (enviados > 0 && erros === 0) {
        status.className = "success";
        status.textContent =
          `Recebemos ${enviados} foto(s) ♡ Obrigada por compartilhar!`;
        input.value = "";
        selectedCount.textContent = "Nenhuma foto selecionada";

      } else if (enviados > 0) {
        status.className = "success";
        status.textContent =
          `${enviados} foto(s) enviadas. ${erros} não puderam ser enviadas.`;

      } else {
        status.className = "error";
        status.textContent =
          "Não foi possível enviar as fotos. Tente novamente.";
      }
    }
  </script>

</body>
</html>
