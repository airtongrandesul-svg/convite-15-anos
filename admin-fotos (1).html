<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Fotos da Júllia</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<style>*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Arial;background:radial-gradient(circle at top,#fffaf2,#f2e4d0);color:#4d3928;display:grid;place-items:center;padding:20px}.card{width:100%;max-width:560px;background:#fffffff2;border:1px solid #d5ad72;border-radius:28px;padding:34px 24px;text-align:center;box-shadow:0 20px 60px #5a41231f}.xv{width:72px;height:72px;border:1px solid #c89b58;border-radius:50%;display:grid;place-items:center;margin:auto;font:28px Georgia;color:#ad7e3d}h1{font:normal 34px Georgia;margin:18px 0 8px}.muted{color:#806e5c;line-height:1.5}input,button{width:100%;min-height:56px;border-radius:14px;font-size:15px;margin-top:12px}input{border:1px solid #d8c4a5;padding:14px;background:#fff}button{border:0;background:linear-gradient(135deg,#d5ad72,#ad7e3d);color:#fff;font-weight:bold;cursor:pointer}button.secondary{background:#fff;color:#8f6633;border:1px solid #c89b58}button:disabled{opacity:.5}#admin{display:none}.status{min-height:24px;margin-top:14px}.ok{color:#56764b}.err{color:#a14444}.count{font:normal 22px Georgia;color:#8f6633;margin:20px 0 5px}</style></head>
<body><main class="card"><div class="xv">XV</div><h1>Fotos da Júllia</h1><p class="muted">Área privada para baixar as fotos da festa.</p>
<section id="login"><input id="email" type="email" value="airtonrsjr3@gmail.com" readonly><input id="password" type="password" placeholder="Senha do acesso às fotos"><button onclick="entrar()">ENTRAR</button><p class="muted" style="font-size:13px">Somente o e-mail autorizado pode acessar.</p></section>
<section id="admin"><div id="count" class="count">Carregando fotos...</div><p class="muted">As fotos serão reunidas em um único arquivo ZIP.</p><button id="zipBtn" onclick="baixarZip()">📦 BAIXAR TODAS AS FOTOS (.ZIP)</button><button class="secondary" onclick="sair()">SAIR</button></section><div id="status" class="status"></div></main>
<script>
const SB_URL="https://vdyocmcdbvgbuvttyeck.supabase.co", KEY="sb_publishable_bx1T6ZBPYjX5Z6zAll33tw_AbWMsj1u", BUCKET="fotos-jullia-15";
const sb=window.supabase.createClient(SB_URL,KEY);let fotos=[];
async function entrar(){const s=document.getElementById("status");s.className="status";s.textContent="Entrando...";const {error}=await sb.auth.signInWithPassword({email:document.getElementById("email").value,password:document.getElementById("password").value});if(error){s.className="status err";s.textContent="Não foi possível entrar. Confira a senha.";return}await carregar()}
async function carregar(){const {data:{user}}=await sb.auth.getUser();if(!user)return;if((user.email||"").toLowerCase()!=="airtonrsjr3@gmail.com"){await sb.auth.signOut();document.getElementById("status").textContent="E-mail não autorizado.";return}document.getElementById("login").style.display="none";document.getElementById("admin").style.display="block";fotos=[];let offset=0;while(true){const {data,error}=await sb.storage.from(BUCKET).list("",{limit:100,offset,sortBy:{column:"name",order:"asc"}});if(error){document.getElementById("status").className="status err";document.getElementById("status").textContent="Não foi possível listar as fotos.";return}if(!data||!data.length)break;fotos.push(...data.filter(x=>x.name));if(data.length<100)break;offset+=100}document.getElementById("count").textContent=fotos.length===1?"1 foto disponível":fotos.length+" fotos disponíveis";document.getElementById("status").textContent=""}
async function baixarZip(){const btn=document.getElementById("zipBtn"),s=document.getElementById("status");if(!fotos.length){s.textContent="Ainda não há fotos para baixar.";return}btn.disabled=true;const zip=new JSZip();let ok=0;for(let i=0;i<fotos.length;i++){s.textContent="Preparando "+(i+1)+" de "+fotos.length+"...";const {data,error}=await sb.storage.from(BUCKET).download(fotos[i].name);if(!error&&data){zip.file(fotos[i].name,data);ok++}}if(!ok){s.className="status err";s.textContent="Não foi possível baixar as fotos.";btn.disabled=false;return}s.textContent="Criando arquivo ZIP...";const blob=await zip.generateAsync({type:"blob",compression:"DEFLATE",compressionOptions:{level:6}});const href=window.URL.createObjectURL(blob),a=document.createElement("a");a.href=href;a.download="Fotos_Jullia_15_Anos.zip";a.click();setTimeout(()=>window.URL.revokeObjectURL(href),3000);s.className="status ok";s.textContent="ZIP criado com "+ok+" foto(s).";btn.disabled=false}
async function sair(){await sb.auth.signOut();location.reload()}sb.auth.getSession().then(({data})=>{if(data.session)carregar()});
</script></body></html>
